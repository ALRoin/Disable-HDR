<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Disable HDR</title>
<style>
    :root {
        --bg-color: #0d0f14;
        --surface-color: #151822;
        --card-color: #1c2030;
        --text-main: #f3f4f6;
        --text-muted: #8a8fa3;
        --accent-color: #4c8dff;
        --accent-hover: #3a7ae0;
        --border-color: #262a3a;
    }
    * { box-sizing: border-box; }
    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: var(--bg-color);
        color: var(--text-main);
        margin: 0; padding: 0;
        display: flex; flex-direction: column;
        height: 100vh;
    }
    .header {
        background-color: var(--surface-color);
        padding: 18px 16px;
        border-bottom: 1px solid var(--border-color);
        position: sticky; top: 0; z-index: 10;
    }
    .header-title-row { margin-bottom: 4px; }
    h2 { margin: 0; font-size: 1.3rem; font-weight: 700; letter-spacing: -0.02em; }
    p.sub { margin: 0 0 14px; font-size: 0.8rem; color: var(--text-muted); }
    .action-buttons { display: flex; gap: 8px; }
    .btn {
        padding: 10px 14px; border: none; border-radius: 8px; font-size: 0.85rem;
        font-weight: 600; cursor: pointer; transition: all 0.15s ease; white-space: nowrap;
    }
    .btn-outline { background: transparent; color: var(--text-muted); border: 1px solid var(--border-color); }
    .btn-outline:active { background: rgba(255,255,255,0.05); color: var(--text-main); }
    .btn-primary { background: var(--accent-color); color: #fff; flex: 1; }
    .btn-primary:active { background: var(--accent-hover); }
    .search-container { margin-top: 12px; display: flex; gap: 8px; }
    .search-input {
        flex: 1; min-width: 0; padding: 11px 14px; background-color: var(--bg-color);
        border: 1px solid var(--border-color); border-radius: 8px; color: var(--text-main);
        font-size: 0.9rem; outline: none;
    }
    .search-input:focus { border-color: var(--accent-color); }
    .app-list { flex: 1; overflow-y: auto; padding: 14px 12px; }
    .app-item {
        display: flex; align-items: center; justify-content: space-between; padding: 13px 14px;
        background-color: var(--surface-color); margin-bottom: 8px; border-radius: 10px;
        border: 1px solid var(--border-color); cursor: pointer;
    }
    .app-item:active { background-color: var(--card-color); border-color: #3b415a; }
    .app-details { flex: 1; overflow: hidden; display: flex; flex-direction: column; }
    .app-name { font-size: 1rem; font-weight: 600; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .app-pkg {
        font-size: 0.75rem; margin: 3px 0 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        font-family: 'Courier New', monospace; color: var(--text-muted);
    }
    .checkbox-container { position: relative; width: 22px; height: 22px; margin-left: 14px; flex-shrink: 0; }
    .checkbox-container input { position: absolute; opacity: 0; height: 0; width: 0; }
    .checkmark {
        position: absolute; top: 0; left: 0; height: 22px; width: 22px; background-color: var(--bg-color);
        border-radius: 6px; border: 2px solid var(--accent-color); transition: all 0.15s ease;
    }
    .checkbox-container input:checked ~ .checkmark { background-color: var(--accent-color); }
    .checkmark:after { content: ""; position: absolute; display: none; }
    .checkbox-container input:checked ~ .checkmark:after { display: block; }
    .checkmark:after { left: 6px; top: 2px; width: 5px; height: 10px; border: solid #fff; border-width: 0 3px 3px 0; transform: rotate(45deg); }
    .status-bar { padding: 10px 16px; font-size: 0.78rem; color: var(--text-muted); border-top: 1px solid var(--border-color); background: var(--surface-color); }
    .loading { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 60px 20px; color: var(--text-muted); font-size: 0.9rem; }
    .spinner { width: 36px; height: 36px; border: 3px solid var(--border-color); border-top-color: var(--accent-color); border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 14px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .hint { font-size: 0.7rem; color: var(--text-muted); margin-top: 4px; }
</style>
</head>
<body>

<header class="header">
    <div class="header-title-row"><h2>Disable HDR</h2></div>
    <p class="sub">Pick which apps get their HDR capability hidden. Empty selection = every app is hooked.</p>
    <div class="action-buttons">
        <button class="btn btn-outline" id="btn-select-all">Select All</button>
        <button class="btn btn-outline" id="btn-clear-all">Clear All</button>
        <button class="btn btn-primary" id="btn-save">Save</button>
    </div>
    <div class="search-container">
        <input type="text" id="search-bar" class="search-input" placeholder="Search app name or package...">
        <button class="btn btn-outline" id="btn-reload">↻</button>
    </div>
</header>

<main class="app-list" id="app-list">
    <div class="loading">
        <div class="spinner"></div>
        <div>Loading installed apps…</div>
    </div>
</main>

<div class="status-bar" id="status">Ready.</div>

<script type="module">
import { exec, toast, listPackages, getPackagesInfo } from './kernelsu.js';

const CONFIG_PATH = "/data/adb/modules/disable_hdr/targets.txt";

let userApps = [];
let selectedPackages = new Set();
let searchQuery = "";

function setStatus(msg) {
    document.getElementById('status').textContent = msg;
}

const generateFallbackName = (pkg) => {
    const parts = pkg.split('.');
    let fallback = parts[parts.length - 1];
    return fallback.charAt(0).toUpperCase() + fallback.slice(1);
};

async function waitForKernelSUCache() {
    for (let i = 0; i < 30; i++) {
        try {
            const pkgs = listPackages('user');
            if (pkgs && pkgs.length > 0) return pkgs;
        } catch (e) {}
        await new Promise(r => setTimeout(r, 200));
    }
    try { return listPackages('user'); } catch (e) { return []; }
}

async function loadApps() {
    const listDiv = document.getElementById('app-list');
    listDiv.innerHTML = `<div class="loading"><div class="spinner"></div><div>Loading installed apps…</div></div>`;
    setStatus('Loading…');

    try {
        if (typeof ksu === 'undefined') {
            throw new Error("KernelSU bridge missing -- open this page from inside KernelSU Manager.");
        }

        const pkgs = await waitForKernelSUCache();
        if (!pkgs || pkgs.length === 0) {
            listDiv.innerHTML = '<div class="loading">No apps found.</div>';
            setStatus('No apps found.');
            return;
        }

        let infoArr = [];
        try { infoArr = getPackagesInfo(pkgs); } catch (e) {}

        userApps = infoArr.map(info => {
            let name = info.appLabel;
            if (!name || name === info.packageName) name = generateFallbackName(info.packageName);
            return { packageName: info.packageName, appName: name };
        });

        const configRes = await exec(`cat "${CONFIG_PATH}" 2>/dev/null`);
        selectedPackages.clear();
        if (configRes.errno === 0 && configRes.stdout) {
            configRes.stdout.split("\n").forEach(line => {
                const t = line.trim();
                if (!t || t.startsWith('#')) return;
                selectedPackages.add(t);
            });
        }

        setStatus(`${userApps.length} apps loaded, ${selectedPackages.size} selected.`);
        renderList();
    } catch (err) {
        listDiv.innerHTML = `<div class="loading">${err.message || err}</div>`;
        setStatus('Error loading apps.');
    }
}

function renderList() {
    const listDiv = document.getElementById('app-list');
    listDiv.innerHTML = '';

    let filtered = userApps.filter(app =>
        !searchQuery ||
        app.appName.toLowerCase().includes(searchQuery) ||
        app.packageName.toLowerCase().includes(searchQuery)
    );
    filtered.sort((a, b) => a.appName.localeCompare(b.appName, undefined, { numeric: true, sensitivity: 'base' }));

    if (filtered.length === 0) {
        listDiv.innerHTML = '<div class="loading">No apps match your search.</div>';
        return;
    }

    const frag = document.createDocumentFragment();
    filtered.forEach(app => {
        const pkg = app.packageName;
        const item = document.createElement('div');
        item.className = 'app-item';
        item.setAttribute('data-package-id', pkg);
        item.innerHTML = `
            <div class="app-details">
                <p class="app-name">${app.appName}</p>
                <p class="app-pkg">${pkg}</p>
            </div>
            <label class="checkbox-container" style="pointer-events: none;">
                <input type="checkbox" value="${pkg}" ${selectedPackages.has(pkg) ? 'checked' : ''}>
                <span class="checkmark"></span>
            </label>
        `;
        frag.appendChild(item);
    });
    listDiv.appendChild(frag);
}

function togglePackage(pkg) {
    if (selectedPackages.has(pkg)) selectedPackages.delete(pkg);
    else selectedPackages.add(pkg);
    renderList();
    setStatus(`${selectedPackages.size} selected (unsaved).`);
}

function selectAll(check) {
    userApps.forEach(app => {
        const matches = !searchQuery || app.appName.toLowerCase().includes(searchQuery) || app.packageName.toLowerCase().includes(searchQuery);
        if (!matches) return;
        if (check) selectedPackages.add(app.packageName);
        else selectedPackages.delete(app.packageName);
    });
    renderList();
    setStatus(`${selectedPackages.size} selected (unsaved).`);
}

async function save() {
    setStatus('Saving…');
    let content = "# Disable HDR target list\n# One package name per line. Empty = hook every app.\n\n";
    Array.from(selectedPackages).sort().forEach(p => content += `${p}\n`);

    try {
        const b64 = btoa(unescape(encodeURIComponent(content)));
        const cmd = `mkdir -p /data/adb/modules/disable_hdr && echo '${b64}' | base64 -d > "${CONFIG_PATH}" && chmod 0644 "${CONFIG_PATH}"`;
        const res = await exec(cmd);
        if (res.errno === 0) {
            setStatus(`Saved. ${selectedPackages.size} apps targeted.`);
            toast('Disable HDR: target list saved');
        } else {
            setStatus('Save failed: ' + res.stderr);
            toast('Disable HDR: save failed');
        }
    } catch (e) {
        setStatus('Save failed: ' + e);
    }
}

document.getElementById('btn-select-all').addEventListener('click', () => selectAll(true));
document.getElementById('btn-clear-all').addEventListener('click', () => selectAll(false));
document.getElementById('btn-save').addEventListener('click', save);
document.getElementById('btn-reload').addEventListener('click', loadApps);
document.getElementById('search-bar').addEventListener('input', (e) => {
    searchQuery = e.target.value.toLowerCase().trim();
    renderList();
});
document.getElementById('app-list').addEventListener('click', (e) => {
    const item = e.target.closest('.app-item');
    if (!item) return;
    const pkg = item.getAttribute('data-package-id');
    const checkbox = item.querySelector('input[type="checkbox"]');
    checkbox.checked = !checkbox.checked;
    togglePackage(pkg);
});

async function init() {
    for (let i = 0; i < 20; i++) {
        if (typeof ksu !== 'undefined') break;
        await new Promise(r => setTimeout(r, 75));
    }
    loadApps();
}
window.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
