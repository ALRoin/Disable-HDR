<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Disable HDR</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: light-dark(#f5f5f7, #121212);
    --card: light-dark(#ffffff, #1e1e1e);
    --text: light-dark(#1c1c1e, #f2f2f2);
    --muted: light-dark(#6b6b70, #9a9a9e);
    --border: light-dark(#e2e2e5, #2c2c2e);
    --accent: #4f7cff;
    --danger: #e5484d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 16px 16px calc(24px + env(safe-area-inset-bottom));
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, Roboto, "Segoe UI", sans-serif;
  }
  h1 { font-size: 20px; margin: 4px 0 2px; }
  p.sub { color: var(--muted); font-size: 13px; margin: 0 0 16px; line-height: 1.4; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 14px;
  }
  .row { display: flex; align-items: center; gap: 10px; }
  input[type="search"], input[type="text"] {
    width: 100%;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
  }
  button {
    border: none;
    border-radius: 10px;
    padding: 10px 16px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  button.primary { background: var(--accent); color: white; }
  button.secondary { background: var(--border); color: var(--text); }
  button:disabled { opacity: 0.5; }
  .app-list { max-height: 46vh; overflow-y: auto; margin-top: 10px; }
  .app-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 4px;
    border-bottom: 1px solid var(--border);
  }
  .app-row:last-child { border-bottom: none; }
  .app-row .meta { flex: 1; min-width: 0; }
  .app-row .label { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .app-row .pkg { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .app-row input[type="checkbox"] { width: 20px; height: 20px; flex-shrink: 0; }
  .status { font-size: 12px; color: var(--muted); margin-top: 8px; min-height: 16px; }
  .footer-actions { position: sticky; bottom: 0; display: flex; gap: 10px; padding-top: 4px; }
  .footer-actions button { flex: 1; }
  .empty-hint { font-size: 13px; color: var(--muted); padding: 8px 4px; }
</style>
</head>
<body>
  <h1>Disable HDR</h1>
  <p class="sub">
    Hides HDR support from apps via Zygisk (LSPlant + Dobby, self-contained -
    no LSPosed needed). Pick specific apps below, or leave everything
    unchecked to apply it everywhere.
  </p>

  <div class="card">
    <input type="search" id="search" placeholder="Search installed apps or type a package name…" />
    <div id="appList" class="app-list"><div class="empty-hint">Loading installed apps…</div></div>
    <div class="row" style="margin-top:10px;">
      <input type="text" id="manualPkg" placeholder="com.example.app (add manually)" />
      <button class="secondary" id="addManual">Add</button>
    </div>
    <div id="status" class="status"></div>
  </div>

  <div class="footer-actions">
    <button class="secondary" id="reload">Reload</button>
    <button class="primary" id="save">Save</button>
  </div>

  <script type="module">
    import { exec, toast, listPackages, getPackagesInfo } from "./kernelsu.js";

    const TARGETS_PATH = "/data/adb/modules/disable_hdr/targets.txt";
    const PKG_RE = /^[a-zA-Z][a-zA-Z0-9_]*(\.[a-zA-Z][a-zA-Z0-9_]*)+$/;

    const appListEl = document.getElementById("appList");
    const searchEl = document.getElementById("search");
    const statusEl = document.getElementById("status");
    const manualPkgEl = document.getElementById("manualPkg");

    /** @type {{packageName:string, appLabel:string, isSystem?:boolean}[]} */
    let allApps = [];
    /** @type {Set<string>} */
    let selected = new Set();

    function friendlyNameFromPackage(pkg) {
      const last = pkg.split(".").pop() || pkg;
      return last.replace(/[_-]+/g, " ").replace(/\b\w/g, (c) => c.toUpperCase());
    }

    async function loadTargets() {
      try {
        const { errno, stdout } = await exec(`cat ${TARGETS_PATH} 2>/dev/null`);
        if (errno !== 0) return new Set();
        return new Set(
          stdout
            .split("\n")
            .map((l) => l.trim())
            .filter((l) => l && !l.startsWith("#"))
        );
      } catch {
        return new Set();
      }
    }

    async function loadInstalledApps() {
      // Preferred path: the official listPackages/getPackagesInfo API (added
      // in newer KernelSU Manager builds) gives real app labels. It's wrapped
      // defensively since older Manager versions won't implement it natively.
      try {
        const names = listPackages("user");
        if (names && names.length) {
          const infos = getPackagesInfo(names);
          if (infos && infos.length) {
            return infos.map((i) => ({ packageName: i.packageName, appLabel: i.appLabel || friendlyNameFromPackage(i.packageName) }));
          }
          return names.map((pkg) => ({ packageName: pkg, appLabel: friendlyNameFromPackage(pkg) }));
        }
      } catch {
        /* fall through to shell-based listing below */
      }

      // Fallback: always works, just without real app labels.
      try {
        const { errno, stdout } = await exec("pm list packages -3");
        if (errno === 0) {
          return stdout
            .split("\n")
            .map((l) => l.trim())
            .filter((l) => l.startsWith("package:"))
            .map((l) => l.slice("package:".length))
            .filter(Boolean)
            .map((pkg) => ({ packageName: pkg, appLabel: friendlyNameFromPackage(pkg) }));
        }
      } catch {
        /* ignore */
      }
      return [];
    }

    function renderList() {
      const query = searchEl.value.trim().toLowerCase();
      const filtered = allApps.filter(
        (a) => !query || a.appLabel.toLowerCase().includes(query) || a.packageName.toLowerCase().includes(query)
      );

      // Selected-but-not-in-the-installed-list entries (added manually, or
      // the app was uninstalled since) still get shown so you don't lose them.
      const shown = new Map(filtered.map((a) => [a.packageName, a]));
      for (const pkg of selected) {
        if (!shown.has(pkg) && (!query || pkg.toLowerCase().includes(query))) {
          shown.set(pkg, { packageName: pkg, appLabel: friendlyNameFromPackage(pkg) });
        }
      }

      const rows = [...shown.values()].sort((a, b) => a.appLabel.localeCompare(b.appLabel));

      if (rows.length === 0) {
        appListEl.innerHTML = `<div class="empty-hint">No matching apps.</div>`;
        return;
      }

      appListEl.innerHTML = "";
      for (const app of rows) {
        const row = document.createElement("label");
        row.className = "app-row";
        row.innerHTML = `
          <input type="checkbox" data-pkg="${app.packageName}" ${selected.has(app.packageName) ? "checked" : ""} />
          <div class="meta">
            <div class="label">${app.appLabel}</div>
            <div class="pkg">${app.packageName}</div>
          </div>`;
        row.querySelector("input").addEventListener("change", (e) => {
          if (e.target.checked) selected.add(app.packageName);
          else selected.delete(app.packageName);
        });
        appListEl.appendChild(row);
      }
    }

    async function init() {
      statusEl.textContent = "";
      const [targets, apps] = await Promise.all([loadTargets(), loadInstalledApps()]);
      selected = targets;
      allApps = apps;
      if (apps.length === 0) {
        statusEl.textContent = "Couldn't list installed apps - you can still add packages manually below.";
      }
      renderList();
    }

    searchEl.addEventListener("input", renderList);

    document.getElementById("addManual").addEventListener("click", () => {
      const pkg = manualPkgEl.value.trim();
      if (!PKG_RE.test(pkg)) {
        statusEl.textContent = `"${pkg}" doesn't look like a valid package name.`;
        return;
      }
      selected.add(pkg);
      manualPkgEl.value = "";
      statusEl.textContent = "";
      renderList();
    });

    document.getElementById("reload").addEventListener("click", init);

    document.getElementById("save").addEventListener("click", async () => {
      const lines = [...selected].filter((p) => PKG_RE.test(p)).sort();
      // Every entry has already been validated against PKG_RE above, so it's
      // safe to interpolate directly into the shell command.
      const cmd = lines.length
        ? `{ ${lines.map((p) => `echo ${p}`).join("; ")}; } > ${TARGETS_PATH}`
        : `: > ${TARGETS_PATH}`;
      try {
        const { errno, stderr } = await exec(cmd);
        if (errno === 0) {
          toast(lines.length ? `Saved - ${lines.length} app(s) targeted` : "Saved - applies to all apps now");
        } else {
          toast("Save failed: " + stderr);
        }
      } catch (e) {
        toast("Save failed: " + e);
      }
    });

    init();
  </script>
</body>
</html>
