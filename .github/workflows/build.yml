name: Build Disable HDR Module

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  build:
    name: Build KernelSU / Magisk Zip
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: npx/setup-ndk@v1
        with:
          ndk-version: r25c

      - name: Compile Native Libraries (CMake)
        run: |
          mkdir -p build/arm64-v8a build/armeabi-v7a

          # Build for arm64-v8a
          cmake -B build/arm64-v8a \
            -DANDROID_ABI=arm64-v8a \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_PLATFORM=android-26 \
            jni/
          cmake --build build/arm64-v8a --config Release

          # Build for armeabi-v7a
          cmake -B build/armeabi-v7a \
            -DANDROID_ABI=armeabi-v7a \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_PLATFORM=android-26 \
            jni/
          cmake --build build/armeabi-v7a --config Release

      - name: Package KernelSU Module
        run: |
          mkdir -p out/zygisk
          
          # Copy compiled binaries to zygisk directory
          cp build/arm64-v8a/libhdr_killer.so out/zygisk/arm64-v8a.so
          cp build/armeabi-v7a/libhdr_killer.so out/zygisk/armeabi-v7a.so
          
          # Copy configuration files
          cp module.prop system.prop out/
          [ -f service.sh ] && cp service.sh out/ || true

          # Compress module directory into flashable ZIP
          cd out
          zip -r ../Disable_HDR_KernelSU_Module.zip .

      - name: Upload Flashable Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Disable_HDR_KernelSU_Module
          path: Disable_HDR_KernelSU_Module.zip
          if-no-files-found: error
