name: Build Zygisk Module

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        uses: nsetup/setup-ndk@v1
        with:
          ndk-version: r25c

      - name: Set Execution Permissions & Environment
        run: |
          chmod +x gradlew package.sh 2>/dev/null || true
          echo "$ANDROID_NDK_HOME" >> $GITHUB_PATH

      - name: Build Native Binaries (ndk-build)
        run: |
          $ANDROID_NDK_HOME/ndk-build \
            -C native/jni/ \
            NDK_PROJECT_PATH=. \
            APP_BUILD_SCRIPT=native/jni/Android.mk \
            NDK_APPLICATION_MK=native/jni/Application.mk \
            NDK_OUT=native/obj \
            NDK_LIBS_OUT=native/libs

      - name: Build DEX Payload & Package Module
        run: |
          ./gradlew :hookdex:assembleRelease
          ./package.sh

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: disable-hdr-zygisk-module
          path: disable-hdr-zygisk.zip
